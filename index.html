<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visualizador 3D de funciones matemáticas, derivadas e integrales con Three.js">
    <title>MathViz 3D — Graficador de Derivadas e Integrales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.7">
    <link rel="stylesheet" href="lessons/lessons.css?v=1.7">
</head>
<body>
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <p class="loader-text">Inicializando MathViz 3D</p>
        </div>
    </div>

    <canvas id="three-canvas"></canvas>

    <header id="app-header">
        <div class="header-left">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
                    <path d="M6 12C8 8 12 6 14 10C16 14 20 12 22 8" stroke="url(#logoGrad2)" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="2" y1="2" x2="26" y2="26">
                            <stop stop-color="#6C63FF"/>
                            <stop offset="1" stop-color="#00D4AA"/>
                        </linearGradient>
                        <linearGradient id="logoGrad2" x1="6" y1="8" x2="22" y2="12">
                            <stop stop-color="#FF6B9D"/>
                            <stop offset="1" stop-color="#FFA751"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>MathViz <span class="accent">3D</span></h1>
        </div>
        <div class="header-right">
            <button id="btn-toggle-grid" class="icon-btn" title="Mostrar/Ocultar Cuadrícula">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/>
                </svg>
            </button>
            <button id="btn-toggle-axes" class="icon-btn active" title="Mostrar/Ocultar Ejes">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2v20M2 12h20M5 5l2 2M17 5l-2 2"/>
                </svg>
            </button>
            <button id="btn-reset-camera" class="icon-btn" title="Restablecer Cámara">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 4v6h6M23 20v-6h-6"/>
                    <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/>
                </svg>
            </button>
        </div>
    </header>

    <aside id="control-panel">
        <div class="panel-section">
            <h2 class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 20C8 14 12 8 16 4"/>
                    <circle cx="4" cy="20" r="2"/>
                    <circle cx="16" cy="4" r="2"/>
                </svg>
                Función
            </h2>
            <div class="input-group">
                <label for="function-input">f(x) =</label>
                <input type="text" id="function-input" value="x^3 - 3*x" placeholder="ej: sin(x), x^2, exp(-x)" spellcheck="false" autocomplete="off">
            </div>
            <div class="preset-functions">
                <button class="preset-btn" data-fn="sin(x)">sin(x)</button>
                <button class="preset-btn" data-fn="cos(x)">cos(x)</button>
                <button class="preset-btn" data-fn="x^2">x²</button>
                <button class="preset-btn" data-fn="x^3 - 3*x">x³-3x</button>
                <button class="preset-btn" data-fn="exp(-x^2)">e⁻ˣ²</button>
                <button class="preset-btn" data-fn="log(abs(x)+0.01)">ln|x|</button>
                <button class="preset-btn" data-fn="tan(x)">tan(x)</button>
                <button class="preset-btn" data-fn="1/(1+exp(-x))">σ(x)</button>
            </div>
        </div>

        <div class="panel-section">
            <h2 class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M3 9h18M9 3v18"/>
                </svg>
                Rango
            </h2>
            <div class="range-controls">
                <div class="range-row">
                    <label>X min</label>
                    <input type="number" id="x-min" value="-8" step="1">
                </div>
                <div class="range-row">
                    <label>X max</label>
                    <input type="number" id="x-max" value="8" step="1">
                </div>
                <div class="range-row">
                    <label>Resolución</label>
                    <input type="range" id="resolution" min="100" max="1000" value="500" step="50">
                    <span id="resolution-value" class="range-value">500</span>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <h2 class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                Visualización
            </h2>
            <div class="toggle-group">
                <div class="toggle-row">
                    <div class="toggle-info">
                        <span class="color-dot original"></span>
                        <span>f(x) — Original</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="show-original" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <div class="toggle-info">
                        <span class="color-dot derivative"></span>
                        <span>f'(x) — Derivada</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="show-derivative" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <div class="toggle-info">
                        <span class="color-dot integral"></span>
                        <span>∫f(x)dx — Integral</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="show-integral" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <div class="toggle-info">
                        <span class="color-dot tangent"></span>
                        <span>Línea Tangente</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="show-tangent">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="panel-section" id="tangent-section" style="display:none;">
            <h2 class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M2 12h7M15 12h7"/>
                </svg>
                Punto Tangente
            </h2>
            <div class="range-row">
                <label>x₀</label>
                <input type="range" id="tangent-x" min="-8" max="8" value="1" step="0.1">
                <span id="tangent-x-value" class="range-value">1.0</span>
            </div>
            <div id="tangent-info" class="info-card">
                <div class="info-row"><span>f(x₀)</span><span id="tangent-fx">—</span></div>
                <div class="info-row"><span>f'(x₀)</span><span id="tangent-fpx">—</span></div>
                <div class="info-row"><span>Pendiente</span><span id="tangent-slope">—</span></div>
            </div>
        </div>

        <div class="panel-section">
            <h2 class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/>
                    <path d="M12 8v4M12 16h.01"/>
                </svg>
                Integral Definida
            </h2>
            <div class="toggle-row" style="margin-bottom: 10px;">
                <div class="toggle-info">
                    <span>Mostrar Área</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="show-area">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div id="area-controls" style="display:none;">
                <div class="range-row">
                    <label>a</label>
                    <input type="number" id="area-a" value="-2" step="0.5">
                </div>
                <div class="range-row">
                    <label>b</label>
                    <input type="number" id="area-b" value="2" step="0.5">
                </div>
                <div id="area-result" class="info-card">
                    <div class="info-row">
                        <span>∫ₐᵇ f(x)dx</span>
                        <span id="area-value">—</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="btn-animate" class="action-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5,3 19,12 5,21"/>
            </svg>
            Animar Dibujo
        </button>
    </aside>

    <div id="info-overlay">
        <div id="cursor-info" style="display:none;">
            <span id="cursor-coords"></span>
        </div>
    </div>

    <div id="formula-display">
        <div id="formula-original" class="formula-item">
            <span class="formula-label original">f(x)</span>
            <span class="formula-expr" id="formula-fx"></span>
        </div>
        <div id="formula-derivative" class="formula-item">
            <span class="formula-label derivative">f'(x)</span>
            <span class="formula-expr" id="formula-dfx"></span>
        </div>
        <div id="formula-integral" class="formula-item">
            <span class="formula-label integral">∫f(x)</span>
            <span class="formula-expr" id="formula-ifx"></span>
        </div>
    </div>

    <div id="error-toast" class="toast hidden">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M15 9l-6 6M9 9l6 6"/>
        </svg>
        <span id="error-message"></span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script src="app.js?v=1.7"></script>
    <script src="version.js?v=1.7"></script>
    <!-- Lecciones (cada una es una pestaña) -->
    <script src="lessons/plot.js?v=1.7"></script>
    <script src="lessons/tabs.js?v=1.7"></script>
    <script src="lessons/quiz.js?v=1.7"></script>
    <script src="lessons/chapters.js?v=1.7"></script>
    <script src="lessons/linear.js?v=1.7"></script>
    <script src="lessons/pythagoras.js?v=1.7"></script>
    <!-- Plugin de ZenBan: guarda el estado dentro del objeto del lienzo (fuera de ZenBan no hace nada) -->
    <script src="zenban-plugin-sdk.js?v=1.7"></script>
    <script src="zenban-integration.js?v=1.7"></script>
</body>
</html>
